{% block title %}Courses - EduPrep{% endblock %}
{% include 'user_navbar.html' %}

{% block content %}
<div class="container-fluid my-4">
  <div class="row">
    <!-- Left Sidebar -->
    <aside class="col-12 col-md-3 mb-4">
      <h5>Filters</h5>
      <form method="get" action="{{ url_for('courses.courses') }}">
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select name="category" class="form-select">
            <option value="">All</option>
            {% for cat in categories %}
              <option value="{{ cat }}" {% if request.args.get('category') == cat %}selected{% endif %}>
                {{ cat }}
              </option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Price Range</label>
          <select name="price" class="form-select">
            <option value="">All</option>
            <option value="low">Under ₹500</option>
            <option value="mid">₹500–₹1000</option>
            <option value="high">Above ₹1000</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Apply</button>
      </form>
    </aside>

    <!-- Right Content -->
    <main class="col-12 col-md-9">
      <div class="row g-4">
        {% for course in courses %}
        <div class="col-12 col-sm-6 col-lg-4">
          <div class="card h-100 shadow-sm">
            <img src="{{ course.ImagePath }}" class="card-img-top img-fluid" alt="{{ course.Name }}">
            <div class="card-body d-flex flex-column">
              <h5 class="card-title">{{ course.Name }}</h5>
              <p class="card-text">{{ course.Description }}</p>
              <p class="fw-bold mt-auto">₹{{ course.Price }}</p>
              <a href="/buy/{{ course.Id }}" class="btn btn-primary mt-2">Buy</a>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </main>
  </div>
</div>
{% endblock %}
