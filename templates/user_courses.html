<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Critical for responsiveness -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses - EduPrep</title>
   <!-- Bootstrap CSS (CDN) -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">


  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .navbar-brand {
      font-weight: bold;
    }
    .filters-toggle {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Include your navbars -->
  {% include 'user_navbar.html' %}

  <!-- Page Content -->
  <div class="container-fluid my-4">
    <div class="row">
      <!-- Sidebar toggle for mobile -->
      <div class="col-12 d-md-none filters-toggle">
        <button class="btn btn-secondary w-100" type="button" data-bs-toggle="collapse" data-bs-target="#filtersCollapse">
          Show Filters
        </button>
      </div>

      <!-- Left Sidebar -->
      <aside class="col-12 col-md-3 mb-4 collapse d-md-block" id="filtersCollapse">
        <h5>Filters</h5>
        <form method="get" action="{{ url_for('courses.courses') }}">
          <div class="mb-3">
            <label class="form-label">Category</label>
            <select name="category" class="form-select">
              <option value="">All</option>
              {% for cat in categories %}
                <option value="{{ cat }}" {% if request.args.get('category') == cat %}selected{% endif %}>
                  {{ cat }}
                </option>
              {% endfor %}
            </select>
          </div>
          <div class="mb-3">
            <label class="form-label">Price Range</label>
            <select name="price" class="form-select">
              <option value="">All</option>
              <option value="low">Under ₹500</option>
              <option value="mid">₹500–₹1000</option>
              <option value="high">Above ₹1000</option>
            </select>
          </div>
          <button type="submit" class="btn btn-primary w-100">Apply</button>
        </form>
      </aside>

      <!-- Right Content -->
      <main class="col-12 col-md-9">
        <div class="row g-4">
          {% for course in courses %}
          <div class="col-12 col-sm-6 col-lg-4">
            <div class="card h-100 shadow-sm">
              <img src="{{ course.ImagePath }}" class="card-img-top img-fluid" alt="{{ course.Name }}">
              <div class="card-body d-flex flex-column">
                <h5 class="card-title">{{ course.Name }}</h5>
                <p class="card-text">{{ course.Description }}</p>
                <p class="fw-bold mt-auto">₹{{ course.Price }}</p>
                <a href="{{ url_for('buy.buy_item', item_type='course', item_id=course.Id) }}" class="btn btn-primary">Buy</a>
              </div>
            </div>
          </div>
          {% endfor %}
        </div>
      </main>
    </div>
  </div>

  <!-- Bootstrap JS bundle (CDN) -->
 <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
