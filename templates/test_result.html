```html
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Test Result</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f4f6fb;
        }

        .result-container {
            max-width: 850px;
            margin: 60px auto;
        }

        .result-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0,0,0,0.07);
        }

        .score {
            font-size: 50px;
            font-weight: 700;
        }

        .stat {
            background: #f7f8fa;
            border-radius: 12px;
            padding: 20px;
        }

    </style>

</head>

<body>


<div class="container result-container">

    <div class="result-card">

        <h2 class="mb-2">
            Test Completed
        </h2>

        <p class="text-muted">
            {{ subject.NameEnglish }} - {{ set_name }}
        </p>


        <div class="score my-4">

            {{ score }} / {{ total }}

        </div>


        <div class="row g-3 mb-4">

            <div class="col-md-4">

                <div class="stat">

                    <small class="text-muted">
                        Total
                    </small>

                    <h4>
                        {{ total }}
                    </h4>

                </div>

            </div>


            <div class="col-md-4">

                <div class="stat">

                    <small class="text-muted">
                        Attempted
                    </small>

                    <h4>
                        {{ attempted }}
                    </h4>

                </div>

            </div>


            <div class="col-md-4">

                <div class="stat">

                    <small class="text-muted">
                        Percentage
                    </small>

                    <h4>
                        {{ percentage }}%
                    </h4>

                </div>

            </div>

        </div>


        <a
            href="{{
                url_for(
                    'demo_test.sets',
                    category_id=category.CategoryId,
                    subcategory_id=subcategory.SubCategoryId,
                    subject_id=subject.SubjectId
                )
            }}"
            class="btn btn-primary"
        >
            Back to Sets
        </a>

    </div>

</div>


</body>

</html>
```
