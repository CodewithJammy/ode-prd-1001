<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>
<body>

{% include 'navbar.html' %}
{% include 'alert_message.html' %}

<div class="container my-4">
  <h2 class="fw-bold mb-4">Admin Dashboard</h2>

  <!-- Tabs -->
  <ul class="nav nav-tabs" id="adminTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" id="courses-tab" data-bs-toggle="tab" data-bs-target="#courses" type="button">Courses</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tests-tab" data-bs-toggle="tab" data-bs-target="#tests" type="button">Tests</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="topics-tab" data-bs-toggle="tab" data-bs-target="#topics" type="button">Topics</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="questions-tab" data-bs-toggle="tab" data-bs-target="#questions" type="button">Questions</button>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="tab-content mt-3">

    <!-- Courses -->
    
    <div class="tab-pane fade {% if active_tab == 'courses' %}show active{% endif %}" id="courses" role="tabpanel">  
      <form method="POST" action="{{ url_for('admin.add_course') }}">
        <div class="mb-3">
          <label>Course Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Description</label>
          <textarea name="description" class="form-control"></textarea>
        </div>
        <div class="mb-3">
          <label>Image URL</label>
          <input type="text" name="image_url" class="form-control">
        </div>
        <div class="mb-3">
          <label>Price</label>
          <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Category</label>
          <input type="text" name="category" class="form-control">
        </div>
        <div class="mb-3">
          <label>Duration</label>
          <input type="text" name="duration" class="form-control">
        </div>
        <div class="mb-3">
          <label>Level</label>
          <input type="text" name="level" class="form-control">
        </div>
        <div class="mb-3">
          <label>Syllabus PDF URL</label>
          <input type="text" name="syllabus_pdf_url" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Add Course</button>
      </form>
    </div>

    <!-- Tests -->
    <div class="tab-pane fade {% if active_tab == 'tests' %}show active{% endif %}" id="tests" role="tabpanel">
      <form method="POST" action="{{ url_for('admin.add_test') }}">
        <div class="mb-3">
          <label>Course</label>
          <!-- Tests tab -->
            <select name="course_id" id="testsCourseSelect" class="form-select" required></select>
        </div>

        <div class="mb-3">
          <label>Test Name</label>
          <input type="text" name="name" id="testName" class="form-control" required>
        </div>

        <div class="mb-3">
          <label>Price</label>
          <input type="text" name="price" id="testPrice" class="form-control" readonly>
        </div>

        <div class="mb-3">
          <label>Test Type</label>
          <select name="test_type" class="form-select">
            <option value="Mock">Mock</option>
            <option value="Full">Full</option>
            <option value="TopicWise">Topic Wise</option>
            <option value="PreviousYear">Previous Year</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Year (optional)</label>
          <input type="number" name="year" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Add Test</button>
      </form>
    </div>

   
<!-- Topics -->
<div class="tab-pane fade {% if active_tab == 'topics' %}show active{% endif %}" id="topics" role="tabpanel">    
  <form method="POST" action="{{ url_for('admin.add_topic') }}">
    <div class="mb-3">
      <label>Course</label>
     <!-- Topics form -->
<select name="course_id" id="topicsCourseSelect" class="form-select" required></select>
    </div>

    <div class="mb-3">
      <label>Test</label>
      <select name="test_id" id="topicsTestSelect" class="form-select" required></select>
    </div>

    <div id="topicsContainer">
      <div class="mb-3 topic-item d-flex align-items-center">
        <input type="text" name="topic_name[]" class="form-control me-2" placeholder="Topic Name" required>
        <button type="button" class="btn btn-danger btn-sm removeTopicBtn">X</button>
      </div>
    </div>

    <button type="button" class="btn btn-secondary mb-3" id="addTopicBtn">+ Add More Topic</button>
    <button type="submit" class="btn btn-primary">Add Topics</button>
  </form>
</div>




    <!-- Questions -->
    <div class="tab-pane fade {% if active_tab == 'questions' %}show active{% endif %}" id="questions" role="tabpanel">
      <form method="POST" enctype="multipart/form-data" >
       <div class="mb-3">
         <label>Course</label>
          <select name="course_id" id="questionsCourseSelect" class="form-select" required></select>
        </div>

<div class="mb-3">
  <label>Test</label>
  <select name="test_id" id="questionsTestSelect" class="form-select" required></select>
</div>

<div class="mb-3">
  <label>Topic</label>
  <select name="topic_id" id="questionsTopicSelect" class="form-select" required></select>
    
  </select>
</div>
        <div class="mb-3">
          <label>Upload Questions (CSV/Excel)</label>
          <input type="file" name="questions_file" class="form-control" required>
        </div>
<button id="validateBtn" class="btn btn-primary">Validate File</button>
<button type="submit" formaction="{{ url_for('admin.upload_questions') }}" 
        class="btn btn-success" id="uploadBtn" disabled>
  Upload
</button>

<div id="successMsg" class="alert alert-success mt-2" style="display:none;">
  File validated successfully! You can now upload.
</div>
<div id="errorMsg" class="alert alert-danger mt-2" style="display:none;">
  Validation failed. Please check your file.
</div>

      </form>
    </div>

  </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
<script>

  
// Tests tab
const testsCourseSelect = document.getElementById("testsCourseSelect");
const testName = document.getElementById("testName");
const testPrice = document.getElementById("testPrice");

fetch("/admin/get-courses")
  .then(r => r.json())
  .then(data => {
    testsCourseSelect.innerHTML = "";
    data.forEach(course => {
      const opt = document.createElement("option");
      opt.value = course.id;
      opt.textContent = course.name;
      opt.setAttribute("data-price", course.price);
      testsCourseSelect.appendChild(opt);
    });
    testsCourseSelect.dispatchEvent(new Event("change"));
  });

testsCourseSelect.addEventListener("change", function() {
  const selectedOption = testsCourseSelect.options[testsCourseSelect.selectedIndex];
  testName.value = selectedOption.textContent + " Test";
  testPrice.value = selectedOption.getAttribute("data-price");
});

  // Topics tab
const topicsCourseSelect = document.getElementById("topicsCourseSelect");
const topicsTestSelect = document.getElementById("topicsTestSelect");

fetch("/admin/get-courses")
  .then(r => r.json())
  .then(data => {
    topicsCourseSelect.innerHTML = "";
    data.forEach(course => {
      const opt = document.createElement("option");
      opt.value = course.id;
      opt.textContent = course.name;
      topicsCourseSelect.appendChild(opt);
    });
    topicsCourseSelect.dispatchEvent(new Event("change"));
  });

topicsCourseSelect.addEventListener("change", function() {
  const courseId = topicsCourseSelect.value;
  fetch(`/admin/get-tests/${courseId}`)
    .then(r => r.json())
    .then(data => {
      topicsTestSelect.innerHTML = "";
      data.forEach(test => {
        const opt = document.createElement("option");
        opt.value = test.id;
        opt.textContent = test.name;
        topicsTestSelect.appendChild(opt);
      });
    });
});

  // --- Questions form ---
  const questionsCourseSelect = document.getElementById("questionsCourseSelect");
  const questionsTestSelect = document.getElementById("questionsTestSelect");
  const questionsTopicSelect = document.getElementById("questionsTopicSelect");

  // Load courses for Questions
  fetch("/admin/get-courses")
    .then(r => r.json())
    .then(data => {
      questionsCourseSelect.innerHTML = "";
      data.forEach(course => {
        const opt = document.createElement("option");
        opt.value = course.id;
        opt.textContent = course.name;
        questionsCourseSelect.appendChild(opt);
      });
      questionsCourseSelect.dispatchEvent(new Event("change"));
    });

  questionsCourseSelect.addEventListener("change", function() {
    const courseId = questionsCourseSelect.value;
    fetch(`/admin/get-tests/${courseId}`)
      .then(r => r.json())
      .then(data => {
        questionsTestSelect.innerHTML = "";
        data.forEach(test => {
          const opt = document.createElement("option");
          opt.value = test.id;
          opt.textContent = test.name;
          questionsTestSelect.appendChild(opt);
        });
        questionsTopicSelect.innerHTML = "";
        if (questionsTestSelect.options.length > 0) {
          questionsTestSelect.dispatchEvent(new Event("change"));
        }
      });
  });

  questionsTestSelect.addEventListener("change", function() {
    const testId = questionsTestSelect.value;
    fetch(`/admin/get-topics/${testId}`)
      .then(r => r.json())
      .then(data => {
        questionsTopicSelect.innerHTML = "";
        data.forEach(topic => {
          const opt = document.createElement("option");
          opt.value = topic.id;
          opt.textContent = topic.title;
          questionsTopicSelect.appendChild(opt);
        });
      });
  });

 // validation
 document.getElementById("validateBtn").addEventListener("click", function(e) {
  e.preventDefault();

  const formData = new FormData(document.querySelector("form"));

  fetch("/admin/validate-questions", {
    method: "POST",
    body: formData
  })
  .then(r => r.json())
  .then(data => {
  if (data.validated) {
    document.getElementById("uploadBtn").disabled = false;
    document.getElementById("successMsg").style.display = "block";
    document.getElementById("errorMsg").style.display = "none";
  } else {
    document.getElementById("uploadBtn").disabled = true;
    document.getElementById("successMsg").style.display = "none";

    let msg = "<strong>Validation failed.</strong><br>";
    msg += `Form IDs → Course=${data.form_values.course_id}, 
            Test=${data.form_values.test_id}, 
            Topic=${data.form_values.topic_id}<br>`;

    if (data.file_ids) {
      msg += "File IDs (first rows):<br>";
      data.file_ids.forEach((row, i) => {
        msg += `Row ${i+1}: Course=${row.CourseId}, Test=${row.TestId}, Topic=${row.TopicId}<br>`;
      });
    }

    document.getElementById("errorMsg").innerHTML = msg;
    document.getElementById("errorMsg").style.display = "block";
  }
})

  .catch(err => {
    console.error(err);
    document.getElementById("errorMsg").style.display = "block";
  });
});


</script>
</body>
</html>
