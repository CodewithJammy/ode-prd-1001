<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>
<body>

{% include 'navbar.html' %}
{% include 'alert_message.html' %}

<div class="container my-4">
  <h2 class="fw-bold mb-4">Admin Dashboard</h2>

  <!-- Tabs -->
  <ul class="nav nav-tabs" id="adminTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" id="courses-tab" data-bs-toggle="tab" data-bs-target="#courses" type="button">Courses</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="tests-tab" data-bs-toggle="tab" data-bs-target="#tests" type="button">Tests</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="topics-tab" data-bs-toggle="tab" data-bs-target="#topics" type="button">Topics</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="questions-tab" data-bs-toggle="tab" data-bs-target="#questions" type="button">Questions</button>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="tab-content mt-3">

    <!-- Courses -->
    <div class="tab-pane fade show active" id="courses" role="tabpanel">
      <form method="POST" action="{{ url_for('admin.add_course') }}">
        <div class="mb-3">
          <label>Course Name</label>
          <input type="text" name="name" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Description</label>
          <textarea name="description" class="form-control"></textarea>
        </div>
        <div class="mb-3">
          <label>Image URL</label>
          <input type="text" name="image_url" class="form-control">
        </div>
        <div class="mb-3">
          <label>Price</label>
          <input type="number" step="0.01" name="price" class="form-control" required>
        </div>
        <div class="mb-3">
          <label>Category</label>
          <input type="text" name="category" class="form-control">
        </div>
        <div class="mb-3">
          <label>Duration</label>
          <input type="text" name="duration" class="form-control">
        </div>
        <div class="mb-3">
          <label>Level</label>
          <input type="text" name="level" class="form-control">
        </div>
        <div class="mb-3">
          <label>Syllabus PDF URL</label>
          <input type="text" name="syllabus_pdf_url" class="form-control">
        </div>
        <button type="submit" class="btn btn-primary">Add Course</button>
      </form>
    </div>

    <!-- Tests -->
    <div class="tab-pane fade" id="tests" role="tabpanel">
      <form method="POST" action="{{ url_for('admin.add_test') }}">
        <div class="mb-3">
          <label>Course</label>
          <select name="course_id" id="courseSelect" class="form-select" required>
            {% for course in courses %}
              <option value="{{ course.Id }}" 
                      data-name="{{ course.Name }}" 
                      data-price="{{ course.Price }}" 
                      data-category="{{ course.Category }}" 
                      data-duration="{{ course.Duration }}" 
                      data-level="{{ course.Level }}" 
                      data-image="{{ course.ImageUrl }}" 
                      data-syllabus="{{ course.SyllabusPdfUrl }}">
                {{ course.Name }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div class="mb-3">
          <label>Test Name</label>
          <input type="text" name="name" id="testName" class="form-control" required>
        </div>

        <div class="mb-3">
          <label>Price</label>
          <input type="text" name="price" id="testPrice" class="form-control" readonly>
        </div>

        <div class="mb-3">
          <label>Test Type</label>
          <select name="test_type" class="form-select">
            <option value="Mock">Mock</option>
            <option value="Full">Full</option>
            <option value="TopicWise">Topic Wise</option>
            <option value="PreviousYear">Previous Year</option>
          </select>
        </div>

        <div class="mb-3">
          <label>Year (optional)</label>
          <input type="number" name="year" class="form-control">
        </div>

        <button type="submit" class="btn btn-primary">Add Test</button>
      </form>
    </div>

    <!-- Topics -->
<!-- Topics -->
<div class="tab-pane fade" id="topics" role="tabpanel">
  <form method="POST" action="{{ url_for('admin.add_topic') }}">
    <div class="mb-3">
      <label>Course</label>
      <select name="course_id" id="topicCourseSelect" class="form-select" required>
        {% for course in courses %}
          <option value="{{ course.Id }}">{{ course.Name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label>Test</label>
      <select name="test_id" id="topicTestSelect" class="form-select" required>
        {% for test in tests %}
          <option value="{{ test.Id }}" data-course-id="{{ test.courseid }}">{{ test.Name }}</option>
        {% endfor %}
      </select>
    </div>

    <div id="topicsContainer">
      <div class="mb-3 topic-item d-flex align-items-center">
        <input type="text" name="topic_name[]" class="form-control me-2" placeholder="Topic Name" required>
        <button type="button" class="btn btn-danger btn-sm removeTopicBtn">X</button>
      </div>
    </div>

    <button type="button" class="btn btn-secondary mb-3" id="addTopicBtn">+ Add More Topic</button>
    <button type="submit" class="btn btn-primary">Add Topics</button>
  </form>
</div>




    <!-- Questions -->
    <div class="tab-pane fade" id="questions" role="tabpanel">
      <form method="POST" enctype="multipart/form-data">
       <div class="mb-3">
  <label>Course</label>
  <select name="course_id" id="questionCourseSelect" class="form-select" required>
    {% for course in courses %}
      <option value="{{ course.Id }}">{{ course.Name }}</option>
    {% endfor %}
  </select>
</div>

<div class="mb-3">
  <label>Test</label>
  <select name="test_id" id="questionTestSelect" class="form-select" required>
    {% for test in tests %}
      <option value="{{ test.Id }}" data-course-id="{{ test.courseid }}">{{ test.Name }}</option>
    {% endfor %}
  </select>
</div>

<div class="mb-3">
  <label>Topic</label>
  <select name="topic_id" id="questionTopicSelect" class="form-select" required>
    {% for topic in topics %}
      <option value="{{ topic.Id }}" data-test-id="{{ topic.testid }}">{{ topic.Title }}</option>
    {% endfor %}
  </select>
</div>
        <div class="mb-3">
          <label>Upload Questions (CSV/Excel)</label>
          <input type="file" name="questions_file" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Validate File</button>
        <button type="submit" class="btn btn-primary" {% if not validated %}disabled{% endif %}>Upload</button>

      </form>
    </div>

  </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
 
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const addBtn = document.getElementById("addTopicBtn");
    const container = document.getElementById("topicsContainer");

    // Add new topic input with remove button
    addBtn.addEventListener("click", function() {
      const newTopic = document.createElement("div");
      newTopic.classList.add("mb-3", "topic-item", "d-flex", "align-items-center");
      newTopic.innerHTML = `
        <input type="text" name="topic_name[]" class="form-control me-2" placeholder="Topic Name" required>
        <button type="button" class="btn btn-danger btn-sm removeTopicBtn">X</button>
      `;
      container.appendChild(newTopic);
    });

    // Delegate remove button click
    container.addEventListener("click", function(e) {
      if (e.target.classList.contains("removeTopicBtn")) {
        e.target.parentElement.remove();
      }
    });
  });
</script>
  <script>
document.addEventListener("DOMContentLoaded", function() {
  const courseSelect = document.getElementById("topicCourseSelect");
  const testSelect = document.getElementById("topicTestSelect");

  function filterTests() {
    const selectedCourseId = courseSelect.value;
    for (let option of testSelect.options) {
      if (option.getAttribute("data-course-id") === selectedCourseId) {
        option.style.display = "block";
      } else {
        option.style.display = "none";
      }
    }
    // Reset selection to first visible option
    testSelect.selectedIndex = [...testSelect.options].findIndex(opt => opt.style.display === "block");
  }

  courseSelect.addEventListener("change", filterTests);
  filterTests(); // run once on page load
});
</script>

 
  
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const courseSelect = document.getElementById("courseSelect");
    const testName = document.getElementById("testName");
    const testPrice = document.getElementById("testPrice");

    courseSelect.addEventListener("change", function() {
      const selectedOption = courseSelect.options[courseSelect.selectedIndex];
      const courseName = selectedOption.getAttribute("data-name");
      const coursePrice = selectedOption.getAttribute("data-price");

      // Auto-fill Test fields
      testName.value = courseName + " Test";
      testPrice.value = coursePrice;
    });

    // Trigger once on page load for default selection
    courseSelect.dispatchEvent(new Event("change"));
  });

// ---- questions ---->>
  document.addEventListener("DOMContentLoaded", function() {
  const courseSelect = document.getElementById("questionCourseSelect");
  const testSelect = document.getElementById("questionTestSelect");
  const topicSelect = document.getElementById("questionTopicSelect");

  function filterTests() {
    const selectedCourseId = courseSelect.value;
    for (let option of testSelect.options) {
      option.style.display = (option.getAttribute("data-course-id") === selectedCourseId) ? "block" : "none";
    }
    testSelect.selectedIndex = [...testSelect.options].findIndex(opt => opt.style.display === "block");
    filterTopics(); // reset topics too
  }

  function filterTopics() {
    const selectedTestId = testSelect.value;
    for (let option of topicSelect.options) {
      option.style.display = (option.getAttribute("data-test-id") === selectedTestId) ? "block" : "none";
    }
    topicSelect.selectedIndex = [...topicSelect.options].findIndex(opt => opt.style.display === "block");
  }

  courseSelect.addEventListener("change", filterTests);
  testSelect.addEventListener("change", filterTopics);

  filterTests(); // run once on page load
});

  </script>
</body>
</html>
