<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Courses - EduPrep</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome.min.css') }}">
</head>
<body>

  <!-- Navbar -->
 {% include 'navbar.html' %}
{
<div class="container-fluid my-4">
  <div class="row">
    <!-- Left Sidebar -->
    <div class="col-md-3">
      <h5>Filters</h5>
      <form method="get" action="{{ url_for('courses.courses') }}">
        <div class="mb-3">
          <label class="form-label">Category</label>
            <select name="category" class="form-select">
              <option value="">All</option>
                {% for cat in categories %}
                    <option value="{{ cat }}" {% if request.args.get('category') == cat %}selected{% endif %}>
                {{ cat }}
                </option>
                {% endfor %}
              </select>
            </div>

        <div class="mb-3">
          <label class="form-label">Price Range</label>
          <select name="price" class="form-select">
            <option value="">All</option>
            <option value="low">Under ₹500</option>
            <option value="mid">₹500–₹1000</option>
            <option value="high">Above ₹1000</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary w-100">Apply</button>
      </form>
    </div>

    <!-- Right Content -->
    <div class="col-md-9">
  <div class="row g-4">
    {% for course in courses %}
    <div class="col-md-4">
      <div class="card shadow-sm">
        <img src="{{ course.ImageUrl }}" class="card-img-top" alt="{{ course.Name }}">
        <div class="card-body">
          <h5 class="card-title">{{ course.Name }}</h5>
          <p class="card-text">{{ course.Description }}</p>
          <p class="fw-bold">₹{{ course.Price }}</p>
           <!-- View button -->
        <a href="{{ url_for('courses.course_details', course_id=course.Id) }}" class="btn btn-outline-primary me-2">
          View
        </a>
          <a href="{{ url_for('buy.buy_item', item_type='course', item_id=course.Id) }}" class="btn btn-primary">Buy</a>
        </div>
      </div>
    </div>
    {% endfor %}
  </div>
</div>

    <div class="tab-pane fade" id="test" role="tabpanel">
  {% for topic in topics %}
    <a href="{{ url_for('tests.topic_testpage', test_id=topic.TestId, topic_id=topic.TopicId) }}"
   class="btn btn-sm btn-outline-primary">
   Take Test
</a>

  {% endfor %}
</div>

  </div>
</div>


  <!-- Footer -->
  {% include 'footer.html' %}

   <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
