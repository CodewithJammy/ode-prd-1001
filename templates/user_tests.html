<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tests - EduPrep</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome.min.css') }}">
  <!-- Custom CSS -->
  <style>
    body {
      background-color: #f8f9fa;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .navbar-brand {
      font-weight: bold;
    }
    .filters-toggle {
      margin-bottom: 1rem;
    }
  </style>
</head>
<body>

  <!-- Include your navbars -->
  {% include 'user_navbar.html' %}

  {% block content %}
<div class="container-fluid my-4">
  <div class="row">
    <!-- Left Sidebar Filters -->
    <div class="col-md-3">
      <h5>Filters</h5>
      <form method="get" action="{{ url_for('tests.tests') }}">
        
        <!-- Category Filter -->
        <div class="mb-3">
          <label class="form-label">Category</label>
          <select name="category" class="form-select">
            <option value="">All</option>
            {% for cat in categories %}
              <option value="{{ cat }}" {% if request.args.get('category') == cat %}selected{% endif %}>
                {{ cat }}
              </option>
            {% endfor %}
          </select>
        </div>

        <!-- Price Filter -->
        <div class="mb-3">
          <label class="form-label">Price Range</label>
          <select name="price" class="form-select">
            <option value="">All</option>
            <option value="low" {% if request.args.get('price') == 'low' %}selected{% endif %}>Under ₹500</option>
            <option value="mid" {% if request.args.get('price') == 'mid' %}selected{% endif %}>₹500–₹1000</option>
            <option value="high" {% if request.args.get('price') == 'high' %}selected{% endif %}>Above ₹1000</option>
          </select>
        </div>

        <!-- Level Filter -->
        <div class="mb-3">
          <label class="form-label">Level</label>
          <select name="level" class="form-select">
            <option value="">All</option>
            {% for lvl in levels %}
              <option value="{{ lvl }}" {% if request.args.get('level') == lvl %}selected{% endif %}>
                {{ lvl }}
              </option>
            {% endfor %}
          </select>
        </div>

        <button type="submit" class="btn btn-primary w-100">Apply</button>
      </form>
    </div>

    <!-- Right Content -->
    <div class="col-md-9">
      <div class="row g-4">
        {% for test in tests %}
        <div class="col-md-4">
          <div class="card shadow-sm">
            <img src="{{ test.ImageUrl }}" class="card-img-top" alt="{{ test.Name }}">
            <div class="card-body">
              <h5 class="card-title">{{ test.Name }}</h5>
              <p class="card-text">{{ test.Description }}</p>
              <p class="fw-bold">₹{{ test.Price }}</p>
              <p class="text-muted">Level: {{ test.Level }}</p>
              <a href="/buy/{{ test.Id }}" class="btn btn-primary">Buy</a>
            </div>
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
  <!-- Bootstrap JS bundle (CDN) -->
 <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
