<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Question Set</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
  <h2 class="mb-3">Upload Question Set</h2>

  <!-- Tabs -->
  <ul class="nav nav-tabs" id="uploadTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" id="normal-tab" data-bs-toggle="tab" data-bs-target="#normal" type="button">Skill Dev & School</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="cert-tab" data-bs-toggle="tab" data-bs-target="#cert" type="button">Certification & OneDay</button>
    </li>
  </ul>

  <div class="tab-content mt-3">
    <!-- Normal Flow -->
    <div class="tab-pane fade show active" id="normal">
      <form id="normalForm">
        <div class="mb-3">
          <label>Category</label>
          <select id="normalCategory" class="form-select" required>
            <option value="">Select Category</option>
            <option value="skilldev">Skill Development</option>
            <option value="school">School</option>
          </select>
        </div>
        <div class="mb-3">
          <label>SubCategory</label>
          <select id="normalSubCategory" class="form-select" disabled>
            <option value="">Select SubCategory</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Subject</label>
          <select id="normalSubject" class="form-select" disabled>
            <option value="">Select Subject</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Content Type</label>
          <select id="normalContentType" class="form-select" disabled>
            <option value="">Select Content Type</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Set Name</label>
          <input type="text" id="normalSetName" class="form-control" placeholder="Set1" required>
        </div>
        <div class="mb-3">
          <label>Upload Location</label>
          <div id="normalPathPreview" class="border p-2">data/Category/SubCategory/Subject/ContentType/Set1.csv</div>
        </div>
        <button class="btn btn-primary">Upload</button>
      </form>
    </div>

        <!-- Certification & OneDay Flow -->
    <div class="tab-pane fade" id="cert">
      <form id="certForm">
        <div class="mb-3">
          <label>Category</label>
          <select id="certCategory" class="form-select" required>
            <option value="">Select Category</option>
            <option value="oneday">OneDay</option>
            <option value="certification">Certification</option>
          </select>
        </div>
        <div class="mb-3">
          <label>SubCategory</label>
          <select id="certSubCategory" class="form-select" disabled>
            <option value="">Select SubCategory</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Subject</label>
          <select id="certSubject" class="form-select" disabled>
            <option value="">Select Subject</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Content Type</label>
          <select id="certContentType" class="form-select" disabled>
            <option value="">Select Content Type</option>
            <option value="completetest">Complete Test</option>
            <option value="previousyears">Previous Years</option>
          </select>
        </div>
        <div class="mb-3">
          <label>Set Name</label>
          <input type="text" id="certSetName" class="form-control" placeholder="Set1" required>
        </div>
        <div class="mb-3">
          <label>Upload Location</label>
          <div id="certPathPreview" class="border p-2">data/Category/SubCategory/Subject/ContentType/Set1.csv</div>
        </div>
        <button class="btn btn-primary">Upload</button>
      </form>
    </div>
  </div>
</div>

<!-- Bootstrap JS bundle for tabs -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


  <script>
// Normal Flow
const normalCategory = document.getElementById("normalCategory");
const normalSubCategory = document.getElementById("normalSubCategory");
const normalSubject = document.getElementById("normalSubject");
const normalContentType = document.getElementById("normalContentType");
const normalSetName = document.getElementById("normalSetName");
const normalPathPreview = document.getElementById("normalPathPreview");

function updateNormalPath() {
  const cat = normalCategory.value;
  const sub = normalSubCategory.value;
  const subj = normalSubject.value;
  const ct = normalContentType.value;
  const set = normalSetName.value.trim() || "Set1";
  if (cat && sub && subj && ct) {
    normalPathPreview.textContent = `data/${cat}/${sub}/${subj}/${ct}/${set}.csv`;
  }
}

normalCategory.addEventListener("change", async function() {
  normalSubCategory.innerHTML = '<option value="">Select SubCategory</option>';
  normalSubject.innerHTML = '<option value="">Select Subject</option>';
  normalContentType.innerHTML = '<option value="">Select Content Type</option>';
  normalSubCategory.disabled = true;
  normalSubject.disabled = true;
  normalContentType.disabled = true;
  if (!this.value) return;
  const resp = await fetch(`/upload/subcategories/${this.value}`);
  const data = await resp.json();
  data.subcategories.forEach(sc => {
    const opt = document.createElement("option");
    opt.value = sc.SubCategoryId;
    opt.textContent = sc.NameEnglish;
    normalSubCategory.appendChild(opt);
  });
  normalSubCategory.disabled = false;
});

normalSubCategory.addEventListener("change", async function() {
  normalSubject.innerHTML = '<option value="">Select Subject</option>';
  normalContentType.innerHTML = '<option value="">Select Content Type</option>';
  normalSubject.disabled = true;
  normalContentType.disabled = true;
  if (!this.value) return;
  const resp = await fetch(`/upload/subjects/${this.value}`);
  const data = await resp.json();
  data.subjects.forEach(s => {
    const opt = document.createElement("option");
    opt.value = s.SubjectId;
    opt.textContent = s.NameEnglish;
    normalSubject.appendChild(opt);
  });
  normalSubject.disabled = false;
});

normalSubject.addEventListener("change", async function() {
  normalContentType.innerHTML = '<option value="">Select Content Type</option>';
  normalContentType.disabled = true;
  if (!this.value) return;
  const resp = await fetch(`/upload/contenttypes/${this.value}`);
  const data = await resp.json();
  data.contenttypes.forEach(ct => {
    const opt = document.createElement("option");
    opt.value = ct.ContenttypeId;
    opt.textContent = ct.NameEnglish;
    normalContentType.appendChild(opt);
  });
  normalContentType.disabled = false;
});

[normalCategory, normalSubCategory, normalSubject, normalContentType, normalSetName].forEach(el => {
  el.addEventListener("change", updateNormalPath);
  el.addEventListener("input", updateNormalPath);
});


    // Certification/OneDay Flow
const certCategory = document.getElementById("certCategory");
const certSubCategory = document.getElementById("certSubCategory");
const certSubject = document.getElementById("certSubject");
const certContentType = document.getElementById("certContentType");
const certSetName = document.getElementById("certSetName");
const certPathPreview = document.getElementById("certPathPreview");

function updateCertPath() {
  const cat = certCategory.value;
  const sub = certSubCategory.value;
  const subj = certSubject.value;
  const ct = certContentType.value;
  const set = certSetName.value.trim() || "Set1";
  if (cat && sub && subj && ct) {
    certPathPreview.textContent = `data/${cat}/${sub}/${subj}/${ct}/${set}.csv`;
  }
}


    certCategory.addEventListener("change", async function() {
  certSubCategory.innerHTML = '<option value="">Select SubCategory</option>';
  certSubject.innerHTML = '<option value="">Select Subject</option>';
  certContentType.disabled = true;
  certSubCategory.disabled = true;

  if (!this.value) return;

  // Fetch subcategories for selected category
  const resp = await fetch(`/upload/subcategories/${this.value}`);
  const data = await resp.json();
  data.subcategories.forEach(sc => {
    const opt = document.createElement("option");
    opt.value = sc.SubCategoryId;
    opt.textContent = sc.NameEnglish;
    certSubCategory.appendChild(opt);
  });
  certSubCategory.disabled = false;
});

// When SubCategory changes → auto-fill Subject with SubCategoryId
certSubCategory.addEventListener("change", function() {
  certSubject.innerHTML = "";
  const opt = document.createElement("option");
  opt.value = this.value;
  opt.textContent = this.value;
  certSubject.appendChild(opt);
  certSubject.disabled = true; // keep locked

  // Enable ContentType (fixed options)
  certContentType.disabled = false;
  updateCertPath();
});

// Update path preview on changes
[certCategory, certSubCategory, certContentType, certSetName].forEach(el => {
  el.addEventListener("change", updateCertPath);
  el.addEventListener("input", updateCertPath);
});

    </script>
</body>
</html>
