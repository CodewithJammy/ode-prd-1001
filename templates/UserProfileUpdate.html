<style>
    body{
        background: linear-gradient(135deg,#0f172a,#1e3a8a,#2563eb);
        min-height:100vh;
    }

    .profile-wrapper{
        min-height:85vh;
        display:flex;
        justify-content:center;
        align-items:center;
        padding:40px 15px;
    }

    .profile-card{
        width:100%;
        max-width:700px;
        background:rgba(255,255,255,.95);
        border-radius:25px;
        overflow:hidden;
        box-shadow:0 20px 50px rgba(0,0,0,.25);
    }

    .profile-header{
        background:linear-gradient(135deg,#2563eb,#4f46e5);
        color:#fff;
        padding:35px;
        text-align:center;
    }

    .profile-header .icon{
        width:80px;
        height:80px;
        border-radius:50%;
        background:rgba(255,255,255,.2);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:36px;
        margin:auto;
        margin-bottom:15px;
    }

    .profile-header h2{
        font-weight:700;
        margin-bottom:8px;
    }

    .profile-header p{
        margin:0;
        opacity:.9;
    }

    .profile-body{
        padding:35px;
    }

    .form-label{
        font-weight:600;
        color:#334155;
    }

    .form-control,
    .form-select{
        height:50px;
        border-radius:12px;
        border:1px solid #dbeafe;
        background:#f8fbff;
    }

    .form-control:focus,
    .form-select:focus{
        border-color:#2563eb;
        box-shadow:0 0 0 .2rem rgba(37,99,235,.2);
    }

    .btn-save{
        width:100%;
        height:52px;
        border:none;
        border-radius:12px;
        background:linear-gradient(135deg,#2563eb,#4f46e5);
        color:#fff;
        font-size:17px;
        font-weight:600;
        transition:.3s;
    }

    .btn-save:hover{
        transform:translateY(-2px);
        box-shadow:0 10px 25px rgba(37,99,235,.35);
    }

    .readonly-field{
        background:#eef4ff !important;
    }
</style>

<div class="profile-wrapper">

    <div class="profile-card">

        <div class="profile-header">

            <div class="icon">
                👤
            </div>

            <h2>Complete Your Profile</h2>

            <p>
                Welcome! You're just one step away from accessing your personalized dashboard.
            </p>

        </div>

        <div class="profile-body">

            <form method="POST">

                <div class="mb-3">
                    <label class="form-label">Email Address</label>
                    <input
                        type="email"
                        class="form-control readonly-field"
                        value="{{ user['Email'] }}"
                        readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        value="{{ user['Username'] or '' }}"
                        placeholder="Choose a username"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Create a secure password"
                        required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Mobile Number</label>
                    <input
                        type="text"
                        name="mobile"
                        class="form-control"
                        value="{{ user['Mobile'] or '' }}"
                        placeholder="Enter your mobile number"
                        required>
                </div>

                <div class="mb-4">
                    <label class="form-label">Gender</label>

                    <select
                        name="gender"
                        class="form-select"
                        required>

                        <option value="">Select Gender</option>

                        <option value="Male"
                            {% if user['Gender']=='Male' %}selected{% endif %}>
                            Male
                        </option>

                        <option value="Female"
                            {% if user['Gender']=='Female' %}selected{% endif %}>
                            Female
                        </option>

                        <option value="Other"
                            {% if user['Gender']=='Other' %}selected{% endif %}>
                            Other
                        </option>

                    </select>
                </div>

                <button class="btn-save" type="submit">
                    🚀 Save & Continue
                </button>

            </form>

        </div>

    </div>

</div>
