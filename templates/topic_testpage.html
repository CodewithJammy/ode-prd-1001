

<div class="tab-content mt-3">
  <!-- Questions Tab -->
  <div class="tab-pane fade show active" id="questions" role="tabpanel">
    <form id="testForm">
      {% for q in questions %}
        <div class="card mb-3 shadow-sm">
  <div class="card-body">
    <p><b>Q{{ loop.index }}: {{ q.QuestionText }}</b></p>
<div class="d-flex flex-column gap-2">
  <button type="button" class="btn btn-outline-primary option-btn w-100"
          data-qid="{{ q.QuestionId }}" data-value="A">{{ q.OptionA }}</button>
  <button type="button" class="btn btn-outline-primary option-btn w-100"
          data-qid="{{ q.QuestionId }}" data-value="B">{{ q.OptionB }}</button>
  <button type="button" class="btn btn-outline-primary option-btn w-100"
          data-qid="{{ q.QuestionId }}" data-value="C">{{ q.OptionC }}</button>
  <button type="button" class="btn btn-outline-primary option-btn w-100"
          data-qid="{{ q.QuestionId }}" data-value="D">{{ q.OptionD }}</button>
</div>


    <input type="hidden" id="ans{{ q.QuestionId }}" value="{{ q.CorrectAnswer }}">
    <input type="hidden" id="chosen{{ q.QuestionId }}" value="">
  </div>
</div>
      {% endfor %}
      <div class="text-center mt-3">
        <button type="button" class="btn btn-success" onclick="submitTest()">Finish Test</button>
      </div>
    </form>
    <div id="scoreBox" class="mt-3 text-center"></div>
  </div>

  <!-- Results Tab -->
  <div class="tab-pane fade" id="results" role="tabpanel">
    <h4>Correct Answers</h4>
    <div id="resultsContent"></div>
    <div class="text-center mt-3">
      <button type="button" class="btn btn-secondary" onclick="retryTest()">Retry</button>
    </div>
  </div>
</div>

<script>
// Handle option selection
document.querySelectorAll('.option-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    let qid = btn.dataset.qid;
    // Reset styles for all options of this question
    document.querySelectorAll(`[data-qid="${qid}"]`).forEach(b => b.classList.remove('btn-primary','text-white'));
    // Highlight chosen
    btn.classList.add('btn-primary','text-white');
    // Save choice
    document.getElementById('chosen'+qid).value = btn.dataset.value;
  });
});

function submitTest() {
  let total = document.querySelectorAll('.card').length;
  let correct = 0;
  let wrong = 0;
  let resultsHTML = "";

  document.querySelectorAll('.card').forEach(card => {
    let qid = card.querySelector('input[type=hidden]').id.replace('ans','');
    let chosen = document.getElementById('chosen'+qid).value;
    let correctAns = document.getElementById('ans'+qid).value;

    if (chosen === correctAns) {
      correct++;
    } else if (chosen) {
      wrong++;
    }

    let qText = card.querySelector('p').innerHTML;
    resultsHTML += `<div class="card mb-3"><div class="card-body">
      <p><b>${qText}</b></p>
      <p class="${chosen===correctAns ? 'text-success' : 'text-danger'}">
        Your Answer: ${chosen || 'Not Attempted'} | Correct: ${correctAns}
      </p>
    </div></div>`;
  });

  let accuracy = ((correct / total) * 100).toFixed(0);
  let scoreBox = document.getElementById('scoreBox');
  scoreBox.innerHTML = `
    <div class="alert ${accuracy>=80 ? 'alert-success' : 'alert-danger'}">
      <h4>${accuracy}% Accuracy</h4>
      <p>${correct} Correct, ${wrong} Wrong</p>
      <p>${accuracy>=80 ? '✅ Passed' : '❌ Failed — Needs 80%'}</p>
    </div>
  `;

  document.getElementById('resultsContent').innerHTML = resultsHTML;
  let resultsTab = new bootstrap.Tab(document.querySelector('#results-tab'));
  resultsTab.show();
}

</script>
