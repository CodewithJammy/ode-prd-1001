<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz App</title>

  <!-- Bootstrap CSS (CDN) -->
 <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <!-- Custom CSS -->
  <style>
    .option-btn {
      transition: all 0.2s ease-in-out;
    }
    .option-btn:hover {
      transform: scale(1.03);
    }
    .option-btn.btn-primary {
      background: linear-gradient(90deg, #0d6efd, #6610f2);
      border: none;
      color: #fff;
    }
  </style>
</head>
<body class="bg-light">

<div class="container my-4">

  <!-- Sticky progress bar -->
<div class="progress mb-3 sticky-top" style="z-index: 1030; top: 0;">
  <div id="quizProgress" class="progress-bar bg-info" role="progressbar"
       style="width:0%" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
    0%
  </div>
</div>

  <!-- Questions -->
  <div id="questionsPane">
  {% for q in questions %}
    <div class="card mb-4 shadow-sm">
      <div class="card-body">
        <p class="fw-bold">Q{{ loop.index }}: {{ q.QuestionText }}</p>

        <!-- Options -->
        <div class="d-flex flex-column gap-2">
          <button type="button" class="btn btn-outline-primary option-btn w-100 rounded-pill"
                  data-qid="{{ q.QuestionId }}" data-value="A">{{ q.OptionA }}</button>
          <button type="button" class="btn btn-outline-primary option-btn w-100 rounded-pill"
                  data-qid="{{ q.QuestionId }}" data-value="B">{{ q.OptionB }}</button>
          <button type="button" class="btn btn-outline-primary option-btn w-100 rounded-pill"
                  data-qid="{{ q.QuestionId }}" data-value="C">{{ q.OptionC }}</button>
          <button type="button" class="btn btn-outline-primary option-btn w-100 rounded-pill"
                  data-qid="{{ q.QuestionId }}" data-value="D">{{ q.OptionD }}</button>
        </div>

        <input type="hidden" id="ans{{ q.QuestionId }}" value="{{ q.CorrectAnswer }}">
        <input type="hidden" id="chosen{{ q.QuestionId }}" value="">
      </div>
    </div>
  {% endfor %}

  <div class="text-center mt-3">
    <button type="button" class="btn btn-success btn-lg px-5 rounded-pill" onclick="submitTest()">Finish Test</button>
  </div>
</div>



  <!-- Results -->
  <div id="resultsPane" style="display:none;">
    <div id="scoreBox" class="mb-4 text-center"></div>
    <h4 class="mb-3">Results Summary</h4>
    <div id="resultsContent"></div>
    <div class="text-center mt-3">
      <button type="button" class="btn btn-secondary rounded-pill" onclick="retryTest()">Retry</button>
    </div>
  </div>
</div>

<!-- Bootstrap Bundle JS (CDN, includes Popper) -->
<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

<script>
// Handle option selection
document.querySelectorAll('.option-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    let qid = btn.dataset.qid;
    document.querySelectorAll(`[data-qid="${qid}"]`).forEach(b => b.classList.remove('btn-primary','text-white'));
    btn.classList.add('btn-primary','text-white');
    document.getElementById('chosen'+qid).value = btn.dataset.value;
    updateProgress();
  });
});

function updateProgress() {
  let total = document.querySelectorAll('#questionsPane .card').length;
  let answered = 0;
  document.querySelectorAll('[id^=chosen]').forEach(h => { if(h.value) answered++; });
  let percent = Math.round((answered/total)*100);
  let bar = document.getElementById('quizProgress');
  bar.style.width = percent+"%";
  bar.textContent = percent+"%";
}

function submitTest() {
  let total = document.querySelectorAll('#questionsPane .card').length;
  let correct = 0;
  let wrong = 0;
  let resultsHTML = "";

  document.querySelectorAll('#questionsPane .card').forEach(card => {
    let qid = card.querySelector('input[id^=ans]').id.replace('ans','');
    let chosen = document.getElementById('chosen'+qid).value;
    let correctAns = document.getElementById('ans'+qid).value;

    if (chosen === correctAns) {
      correct++;
    } else if (chosen) {
      wrong++;
    }

    let qText = card.querySelector('p').innerHTML;

    // Get actual option texts from the original card
    let opts = card.querySelectorAll('.option-btn');
    let optionMap = {};
    opts.forEach(btn => {
      optionMap[btn.dataset.value] = btn.textContent;
    });

    // Build result card with actual option text
    resultsHTML += `
      <div class="card mb-4 shadow-sm">
        <div class="card-body">
          <p class="fw-bold">${qText}</p>
          <div class="d-flex flex-column gap-2">
            ${['A','B','C','D'].map(letter => {
              let text = optionMap[letter];
              let classes = "btn w-100 rounded-pill ";
              if (chosen === letter) {
                classes += (chosen === correctAns) ? "btn-success" : "btn-danger";
              } else {
                classes += "btn-outline-secondary";
              }
              return `<button type="button" class="${classes}" disabled>${text}</button>`;
            }).join('')}
          </div>
          <p class="mt-2 text-success fw-bold">Correct Answer: ${optionMap[correctAns]}</p>
        </div>
      </div>`;
  });

  let accuracy = ((correct / total) * 100).toFixed(0);
  let scoreBox = document.getElementById('scoreBox');
  scoreBox.innerHTML = `
    <div class="alert ${accuracy>=80 ? 'alert-success' : 'alert-danger'}">
      <h4>${accuracy}% Accuracy</h4>
      <p>${correct} Correct, ${wrong} Wrong</p>
      <p>${accuracy>=80 ? '✅ Passed' : '❌ Failed — Needs 80%'}</p>
    </div>
  `;

  document.getElementById('resultsContent').innerHTML = resultsHTML;
  document.getElementById('questionsPane').style.display = 'none';
  document.getElementById('resultsPane').style.display = 'block';
}

  
function retryTest() {
  document.querySelectorAll('.option-btn').forEach(btn => btn.classList.remove('btn-primary','text-white'));
  document.querySelectorAll('[id^=chosen]').forEach(h => h.value = "");
  document.getElementById('scoreBox').innerHTML = "";
  document.getElementById('resultsContent').innerHTML = "";
  document.getElementById('quizProgress').style.width = "0%";
  document.getElementById('quizProgress').textContent = "0%";
  document.getElementById('resultsPane').style.display = 'none';
  document.getElementById('questionsPane').style.display = 'block';
}
</script>
</body>
</html>
