<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ course.Name }} - Course Details</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% include 'navbar.html' %}

<div class="container-fluid my-4">
  <!-- Course Header -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <div>
      <h3 class="fw-bold">{{ course.Name }}</h3>
      <p class="text-muted">{{ course.Description }}</p>
    </div>
    <div>
      <span class="badge bg-primary fs-6">₹{{ course.Price }}</span>
    </div>
  </div>

  <!-- Secondary Navbar -->
  <ul class="nav nav-pills mb-3" id="courseTabs" role="tablist">
    <li class="nav-item">
      <button class="nav-link active" id="syllabus-tab" data-bs-toggle="pill" data-bs-target="#syllabus" type="button" role="tab">Syllabus</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="path-tab" data-bs-toggle="pill" data-bs-target="#path" type="button" role="tab">Learning Path</button>
    </li>
    <li class="nav-item">
      <button class="nav-link" id="test-tab" data-bs-toggle="pill" data-bs-target="#test" type="button" role="tab">Test</button>
    </li>
  </ul>

  <!-- Tab Content -->
  <div class="tab-content" id="courseTabsContent">
    <!-- Syllabus -->
    <div class="tab-pane fade show active" id="syllabus" role="tabpanel">
      <iframe src="{{ course.SyllabusPdfUrl }}" width="100%" height="600px" style="border:none;"></iframe>
    </div>

    <!-- Learning Path -->
    <div class="tab-pane fade" id="path" role="tabpanel">
        <div class="row">
  <!-- Left pane: topics as tab list -->
            <!-- Toggle button (visible on mobile) -->
<button class="btn btn-primary d-md-none mb-2" type="button" data-bs-toggle="offcanvas" data-bs-target="#topicSidebar">
  Topics
</button>

<!-- Offcanvas Sidebar -->
<div class="offcanvas offcanvas-start d-md-block border-end" tabindex="-1" id="topicSidebar">
  <div class="offcanvas-header d-md-none">
    <h5 class="offcanvas-title">Topics</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body p-0">
    <div class="list-group" id="topicList" role="tablist">
      {% for topic in topics %}
        <a class="list-group-item list-group-item-action {% if loop.first %}active{% endif %}
                  {% if topic.status == 'completed' %}list-group-item-success{% else %}list-group-item-secondary{% endif %}"
           id="list-{{ topic.Id }}-list"
           data-bs-toggle="list"
           href="#list-{{ topic.Id }}"
           role="tab"
           aria-controls="list-{{ topic.Id }}">
          {{ topic.Title }}
        </a>
      {% endfor %}
    </div>
  </div>
</div>


  <!-- Right pane: tab content -->
 <!-- Right pane: tab content -->
<div class="col-md-9">
  <div class="tab-content" id="nav-tabContent">
    {% for topic in topics %}
      <div class="tab-pane fade {% if loop.first %}show active{% endif %}"
           id="list-{{ topic.Id }}"
           role="tabpanel"
           aria-labelledby="list-{{ topic.Id }}-list">

        <!-- Content View -->
        <div id="content-{{ topic.Id }}">
          <div class="mt-2 d-flex justify-content-between">
            <button class="btn btn-sm btn-outline-success" onclick="markCompleted({{ topic.Id }})">Mark Completed</button>
            <button class="btn btn-sm btn-outline-primary" onclick="openTest({{ topic.Id }}, '{{ url_for('tests.topic_testpage', test_id=topic.TestId, topic_id=topic.Id) }}')">
             Take Test
            </button>

          </div>
          <h4>{{ topic.Title }}</h4>
          <iframe src="{{ topic.ContentPdfUrl }}" width="100%" height="600px" style="border:none;"></iframe>
        </div>

        <!-- Test View -->
        <div id="test-{{ topic.Id }}" style="display:none;">
          <div class="d-flex justify-content-between mb-2">
            <button class="btn btn-sm btn-outline-secondary" onclick="backToContent({{ topic.Id }})">← Back to Content</button>
          </div>
          <iframe id="testFrame-{{ topic.Id }}" src="" width="100%" height="600px" style="border:none;"></iframe>
        </div>

      </div>
    {% endfor %}
  </div>
</div>

</div>  
</div>

   <!-- Test -->


  </div>
</div>

<script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>

  <script>
function openTest(topicId, testUrl) {
  document.getElementById('content-' + topicId).style.display = 'none';
  document.getElementById('test-' + topicId).style.display = 'block';
  document.getElementById('testFrame-' + topicId).src = testUrl;
}


function backToContent(topicId) {
  // Hide test, show content
  document.getElementById('test-' + topicId).style.display = 'none';
  document.getElementById('content-' + topicId).style.display = 'block';
}
  

function loadTopic(topicId) {
  fetch(`/get_topic/${topicId}`)
    .then(res => res.json())
    .then(data => {
      document.getElementById('topicTitle').textContent = data.title;
      document.getElementById('topicDesc').textContent = data.description;
    });
}

function markCompleted(topicId) {
  fetch('/mark_topic_completed', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({topic_id: topicId})
  }).then(() => {
    let btn = document.getElementById('topicBtn' + topicId);
    btn.classList.remove('list-group-item-secondary');
    btn.classList.add('list-group-item-success');
  });
}
</script>
</body>
</html>
