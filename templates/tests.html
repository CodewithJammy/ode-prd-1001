{% extends "index.html" %}
{% block content %}
<div class="container py-4">
  <h2 class="mb-4 text-center">Available Tests</h2>
  <!-- Paste your test tab structure here -->
  
<!-- Offcanvas Panel for Tests -->
<div class="offcanvas offcanvas-start w-100" tabindex="-1" id="testsPanel">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Available Tests</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">

    <!-- Tabs for Modules -->
    <ul class="nav nav-pills mb-3" id="testsTab" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="banking-tab" data-bs-toggle="tab" data-bs-target="#banking" type="button" role="tab">Banking</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="ssc-tab" data-bs-toggle="tab" data-bs-target="#ssc" type="button" role="tab">SSC</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="railway-tab" data-bs-toggle="tab" data-bs-target="#railway" type="button" role="tab">Railway</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="upsc-tab" data-bs-toggle="tab" data-bs-target="#upsc" type="button" role="tab">UPSC</button>
      </li>
    </ul>

    <!-- Tab Content -->
    <div class="tab-content" id="testsTabContent">

      <!-- Banking Tab -->
      <div class="tab-pane fade show active" id="banking" role="tabpanel" aria-labelledby="banking-tab">
        <div class="row g-4">
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body text-center">
                <h5 class="card-title">IBPS PO Test Series</h5>
                <p class="card-text">20 Full Length Mocks</p>
                <p class="fw-bold text-success">₹499</p>
                <button class="btn btn-primary w-100">Buy Now</button>
              </div>
            </div>
          </div>
          <div class="col-md-4">
            <div class="card shadow-sm h-100">
              <div class="card-body text-center">
                <h5 class="card-title">SBI Clerk Practice</h5>
                <p class="card-text">15 Mock Tests</p>
                <p class="fw-bold text-success">₹399</p>
                <button class="btn btn-primary w-100">Buy Now</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- SSC Tab -->
      <div class="tab-pane fade" id="ssc" role="tabpanel" aria-labelledby="ssc-tab">
        <div class="alert alert-info text-center">Mock test will come soon 🚀</div>
      </div>

      <!-- Railway Tab -->
      <div class="tab-pane fade" id="railway" role="tabpanel" aria-labelledby="railway-tab">
        <div class="alert alert-info text-center">Mock test will come soon 🚀</div>
      </div>

      <!-- UPSC Tab -->
      <div class="tab-pane fade" id="upsc" role="tabpanel" aria-labelledby="upsc-tab">
        <div class="alert alert-info text-center">Mock test will come soon 🚀</div>
      </div>

    </div>
  </div>
</div>



</div>
{% endblock %}
