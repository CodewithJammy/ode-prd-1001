
<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ category.NameEnglish }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
        }

        .page-container {
            max-width: 1000px;
            margin: 50px auto;
        }

        .category-card {
            border: none;
            border-radius: 16px;
            transition: 0.2s;
        }

        .category-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.10);
        }

        .card-link {
            text-decoration: none;
            color: inherit;
        }

    </style>

</head>

<body>

<div class="container page-container">
    <a
        class="back"
        href="{{ url_for(
            'home'
        ) }}"
    >
        ← Back to Home Page
    </a>
    <h2>
        {{ category.NameEnglish }}
    </h2>

    <p class="text-muted mb-4">
        {{ category.NameHindi }}
    </p>


    <div class="row g-4">

        {% for item in subcategories %}

        <div class="col-md-4">

            <a
                class="card-link"
                href="{{
                    url_for(
                        'demo_test.category_flow',
                        category_id=category.CategoryId,
                        subcategory_id=item.SubCategoryId
                    )
                }}"
            >

                <div class="card category-card shadow-sm">

                    <div class="card-body p-4">

                        <h5>
                            {{ item.NameEnglish }}
                        </h5>

                        <p class="text-muted mb-0">
                            {{ item.NameHindi }}
                        </p>

                    </div>

                </div>

            </a>

        </div>

        {% else %}

        <div class="alert alert-warning">
            No subcategories available.
        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
