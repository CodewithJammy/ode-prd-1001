<div id="loginModal" class="modal">
  <div class="modal-content">
    <span class="close" onclick="closeModal('loginModal')">&times;</span>
    <h2>Login</h2>
    <form onsubmit="return handleLogin(event)">
      <input type="hidden" name="exam_slug" id="examSlug">
      <label>Email:</label>
      <input type="email" required><br><br>
      <label>Password:</label>
      <input type="password" required><br><br>
      <button type="submit">Login</button>
      <button onclick="document.getElementById('forgotPasswordModal').style.display='block'">Forgot Password?</button>
      <button type="button" onclick="openModal('signupModal')">Signup</button>
    </form>
  </div>
</div>
