<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Payment - EduPrep</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
</head>
<body>

  <!-- Navbar -->
  {% include 'navbar.html' %}

  <div class="container my-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title">Confirm Purchase</h4>
        <p><strong>Course/Test:</strong> {{ item.Name }}</p>
        <p><strong>Description:</strong> {{ item.Description }}</p>
        <p><strong>Price:</strong> ₹{{ item.Price }}</p>

        <form method="post" action="{{ url_for('process_payment', item_type=item_type, item_id=item.Id) }}">
          <!-- Hidden fields to capture user + item info -->
          <input type="hidden" name="user_id" value="{{ user.Id }}">
          <input type="hidden" name="username" value="{{ user.Username }}">
          <input type="hidden" name="email" value="{{ user.Email }}">
          <input type="hidden" name="mobile" value="{{ user.Mobile }}">
          <input type="hidden" name="course_type" value="{{ item_type }}">
          <input type="hidden" name="course_id" value="{{ item.Id }}">

          <div class="mb-3">
            <label class="form-label">Payment Method</label>
            <select name="method" class="form-select">
              <option value="cash" selected>Cash</option>
              <!-- Later you can add card/UPI/netbanking -->
            </select>
          </div>

          <button type="submit" class="btn btn-success w-100">Confirm & Pay</button>
        </form>
      </div>
    </div>
  </div>

  {% include 'footer.html' %}
  <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
</body>
</html>
