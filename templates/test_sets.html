```html
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>{{ subject.NameEnglish }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>

        body {
            background: #f5f7fb;
            min-height: 100vh;
        }

        .page-container {
            max-width: 1000px;
            margin: 50px auto;
        }

        .set-card {
            border: none;
            border-radius: 15px;
            transition: 0.2s;
        }

        .set-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(0,0,0,0.10);
        }

        .set-link {
            text-decoration: none;
            color: inherit;
        }

        .set-number {
            font-size: 30px;
            font-weight: 700;
        }

    </style>

</head>

<body>

<div class="container page-container">

    <div class="mb-4">

        <h2>
            {{ subject.NameEnglish }}
        </h2>

        <p class="text-muted">
            {{ subject.NameHindi }}
        </p>

        <small class="text-muted">
            Select a test set
        </small>

    </div>


    <div class="row g-4">

        {% for test_set in sets %}

        <div class="col-md-4">

            <a
                class="set-link"
                href="{{
                    url_for(
                        'test.test_page',
                        category_id=category.CategoryId,
                        subcategory_id=subcategory.SubCategoryId,
                        subject_id=subject.SubjectId,
                        set_name=test_set.name
                    )
                }}"
            >

                <div class="card set-card shadow-sm">

                    <div class="card-body p-4 text-center">

                        <div class="set-number">
                            {{ test_set.name }}
                        </div>

                        <p class="text-muted mb-0">
                            Start Test
                        </p>

                    </div>

                </div>

            </a>

        </div>

        {% else %}

        <div class="col-12">

            <div class="alert alert-warning">

                No test sets found for this subject.

            </div>

        </div>

        {% endfor %}

    </div>

</div>

</body>

</html>
```
